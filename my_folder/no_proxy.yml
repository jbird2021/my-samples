- hosts: localhost
  gather_facts: false
  tasks:
    - name: Show proxy-related env from the EE
      ansible.builtin.debug:
        msg:
          NO_PROXY: "{{ lookup('env', 'NO_PROXY') }}"
          no_proxy: "{{ lookup('env', 'no_proxy') }}"
          HTTPS_PROXY: "{{ lookup('env', 'HTTPS_PROXY') }}"
          https_proxy: "{{ lookup('env', 'https_proxy') }}"
          HTTP_PROXY: "{{ lookup('env', 'HTTP_PROXY') }}"
          http_proxy: "{{ lookup('env', 'http_proxy') }}"
